[workspace]
members = [".", "bench"]

[package]
name = "rslu"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small, deterministic, offline natural-language-understanding toolkit: intent classification, slot filling and entity linking"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/dmavrotas/rslu"
keywords = ["nlu", "nlp", "intent", "slot-filling", "offline"]
categories = ["text-processing", "science"]

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
debug = false
