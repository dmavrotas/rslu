[package]
name = "rslu-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Benchmark harness for rslu (ATIS, SNIPS, ...)"
license = "Apache-2.0"
publish = false

[[bin]]
name = "rslu-bench"
path = "src/main.rs"

[dependencies]
rslu = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
anyhow = "1"
